<body>
  <div id="app">
    <main>
      <h1>אליאס – משחק מילים לקבוצות</h1>
      <p>מסבירים מילה בלי להגיד אותה, והקבוצה מנחשת. משחק מילים בעברית מטלפון אחד או מכמה טלפונים עם קוד משחק.</p>
      <p><a href="how-to-play.html">חוקי המשחק המלאים</a></p>
    </main>
  </div>
  <p id="net" class="net" role="status"></p>
  <div id="toast" class="toast" popover="manual" role="status"></div>

  <dialog id="leave-dialog" aria-labelledby="leave-title">
    <h2 id="leave-title">לעזוב את החדר?</h2>
    <p>המשחק ממשיך אצל האחרים, ואפשר לחזור עם אותו קוד.</p>
    <form method="dialog" class="dialog-actions">
      <button class="btn" value="cancel" autofocus>להישאר</button>
      <button class="btn bad" value="leave">לעזוב</button>
    </form>
  </dialog>

  <dialog id="share-dialog" aria-labelledby="share-title" closedby="any">
    <h2 id="share-title">קישור להצטרפות</h2>
    <p>העתיקו את הקישור ושלחו אותו.</p>
    <input class="field" readonly aria-labelledby="share-title" dir="ltr">
    <form method="dialog" class="dialog-actions">
      <button class="btn" value="close" autofocus>סגירה</button>
    </form>
  </dialog>

  <noscript>צריך להפעיל JavaScript כדי לשחק.</noscript>
