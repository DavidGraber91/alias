<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ניהול אליאס</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #111; }
    .card { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .running { border-inline-start: 4px solid #2e7d32; }
    .over { opacity: .6; }
    .num { direction: ltr; unicode-bidi: isolate; }
  </style>
</head>
<body>
  <h1>ניהול אליאס</h1>
  <button id="login" type="button">כניסה עם Google</button>
  <p id="status" role="status"></p>
  <section id="summary" hidden><p>נוצרו בסך הכול: <span id="created" class="num">…</span></p></section>
  <section id="rooms"></section>
  <script type="module" src="admin.js"></script>
</body>
</html>
