<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ניהול אליאס</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #111; }
    button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #888; background: #fff; cursor: pointer; }
    button.danger { background: #c62828; color: #fff; border-color: #c62828; }
    button:disabled { opacity: .5; cursor: default; }
    .card { background: #fff; border-radius: 12px; padding: 12px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .running { border-inline-start: 4px solid #2e7d32; }
    .over { opacity: .6; }
    .num { direction: ltr; unicode-bidi: isolate; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>ניהול אליאס</h1>
  <button id="login" type="button" hidden>כניסה עם Google</button>
  <p id="status" role="status"></p>
  <section id="summary" hidden></section>
  <div class="toolbar">
    <button id="cleanup" type="button" class="danger" disabled>מחיקת חדרים לא פעילים (מעל 3 שעות)</button>
  </div>
  <section id="rooms"></section>
  <script type="module" src="admin.js"></script>
</body>
</html>
